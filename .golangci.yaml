version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  go: "1.27"

linters:
  default: none

  enable:
    - govet
    - staticcheck
    - errcheck
    - errorlint
    - nilerr
    - bodyclose
    - contextcheck
    - copyloopvar
    - usetesting
    - testifylint
    - gosec
    - revive
    - misspell
    - unconvert
    - unparam
    - ineffassign
    - whitespace
    - gocognit
    - gocyclo
    - funlen
    - nestif
    - dupl
    - unused
    - exhaustive
    - sloglint

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable-all: true
      settings:
        shadow:
          strict: true

    gocognit:
      min-complexity: 25

    gocyclo:
      min-complexity: 15

    funlen:
      lines: 90
      statements: 60
      ignore-comments: true

    nestif:
      min-complexity: 4

    lll:
      line-length: 120
      tab-width: 4

    gosec:
      excludes:
        - G104

    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming

    staticcheck:
      checks:
        - "all"

    sloglint:
      attr-only: true
      no-global: all
      static-msg: true
      no-raw-keys: true

formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt

  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/infast1k/notice-auth

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    - path: _test\.go
      linters:
        - funlen
        - lll
        - dupl
        - gosec
        - errcheck

    - path: \.pb\.go$
      linters: [all]
    - path: \.connect\.go$
      linters: [all]
    - path: ^.*sqlc/.*\.sql\.go$
      linters: [all]
